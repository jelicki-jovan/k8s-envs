apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/argocd/prod/external-secrets/values.yml
    - repoURL: https://github.com/jelicki-jovan/k8s-envs.git
      targetRevision: main
      ref: values
    # Per-namespace SecretStores + service accounts (namespace prod is created by apps-prod)
    - repoURL: https://github.com/jelicki-jovan/k8s-envs.git
      targetRevision: main
      path: argocd/prod/external-secrets/stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO CRDs are too large for client-side apply (last-applied annotation > 256 KB)
      - ServerSideApply=true
    # Stores need their namespace (prod: created by apps-prod): retry until it exists
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
