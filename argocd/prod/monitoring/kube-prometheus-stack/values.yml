# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana, kube-state-metrics,
# node-exporter + default dashboards and alert rules. All on the system nodes except node-exporter
# (DaemonSet on every node).

crds:
  enabled: true

# EKS runs the control plane (etcd, scheduler, controller-manager): not scrapable, would only give
# permanently "down" targets and false alerts. kube-proxy metrics listen on localhost only.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

prometheusOperator:
  nodeSelector:
    workload-type: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        workload-type: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 15d
    # Safety net below the 20Gi volume: oldest data is dropped before the disk fills up
    retentionSize: 18GB
    # Pick up ServiceMonitors/PodMonitors/PrometheusRules from all namespaces, not only this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    nodeSelector:
      workload-type: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    # Not on the same node as Loki (the two biggest memory users). Preferred, not required: both volumes
    # are AZ-bound (only 2 system nodes per AZ at most), so a hard rule could leave one Pending.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: loki
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload-type: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  # Admin password generated by the chart (Secret kube-prometheus-stack-grafana), UI via port-forward
  serviceAccount:
    create: true
    name: grafana
    annotations:
      # Terraform: hw-eks-grafana-prod, read-only CloudWatch for the CloudWatch data source
      eks.amazonaws.com/role-arn: arn:aws:iam::003636669641:role/hw-eks-grafana-prod
  # Dashboards come from ConfigMaps (sidecar), nothing to persist
  persistence:
    enabled: false
  # "helm test" pod, not used with GitOps
  testFramework:
    enabled: false
  nodeSelector:
    workload-type: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  # Was 192Mi/384Mi: OOMKilled (Explore + Loki queries + background plugin install at startup)
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      jsonData:
        # "default" = AWS SDK credential chain → the IRSA role from the service account annotation
        authType: default
        defaultRegion: us-east-1

kube-state-metrics:
  nodeSelector:
    workload-type: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# DaemonSet on every node (system + Karpenter), so it tolerates all taints
prometheus-node-exporter:
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
