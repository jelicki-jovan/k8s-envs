apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  weight: 100
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # SCP allows only *.medium and smaller; t2 excluded (Xen, no prefix delegation)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium", "t3a.small", "t3a.medium"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a", "us-east-1b", "us-east-1c"]
      # Don't force node rotation; keep nodes stable while running.
      # Consolidation still removes idle/underutilized nodes.
      expireAfter: Never
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Wait until pods settle (rollouts, HPA scale-down) before consolidating: at 1m it consolidated
    # mid-rollout and broke the replicas' zone spread
    consolidateAfter: 10m
