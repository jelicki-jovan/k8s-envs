# /api → backend Service (internal ClusterIP). The backend has no Ingress: it's reachable only here.
# Hostname resolved at request time via CoreDNS (resolver + variable), so nginx starts even if the
# backend Service doesn't exist yet (no startup-order dependency between the two apps).
location /api/ {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $backend "hw-backend-dev.dev.svc.cluster.local";
    proxy_pass http://$backend:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
