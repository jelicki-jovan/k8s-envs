# The only public entry point: the ALB sends everything to the frontend; nginx serves the React app
# and proxies /api to the internal backend Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hw-frontend-dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-name: hw-alb-dev
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hw-frontend-dev
                port:
                  name: http
