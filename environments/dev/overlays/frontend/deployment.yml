apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-frontend-dev
spec:
  # Dev: 1 replica, no spread rules (prod: 3, spread over AZs / capacity types / nodes)
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-frontend-dev
  template:
    metadata:
      labels:
        app: hw-frontend-dev
    spec:
      serviceAccountName: hw-frontend-dev
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: frontend
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps pid + temp files in /tmp
            - name: tmp
              mountPath: /tmp
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-snippets
          configMap:
            name: hw-frontend-dev-nginx
