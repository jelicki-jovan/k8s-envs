# Only the keys the backend needs. The app logs in to the DB as app_user with IAM auth (no password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hw-backend-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hw-backend-dev
    creationPolicy: Owner
  data:
    - secretKey: JWT_KEY
      remoteRef:
        key: dev/backend
        property: JWT_KEY
---
# Master credentials (RDS-managed secret), only for the migration Job: schema changes need the table owner
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hw-backend-migrate-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hw-backend-migrate-dev
    creationPolicy: Owner
  data:
    - secretKey: PROD_DB_USERNAME
      remoteRef:
        key: rds!db-b0a24fd4-0a81-441f-9771-c929a1baf35e
        property: username
    - secretKey: PROD_DB_PASSWORD
      remoteRef:
        key: rds!db-b0a24fd4-0a81-441f-9771-c929a1baf35e
        property: password
