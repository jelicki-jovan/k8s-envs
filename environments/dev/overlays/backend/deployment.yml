apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-backend-dev
spec:
  # Dev: 1 replica, no HPA, no spread rules (prod: HPA 3-6, spread over AZs / capacity types / nodes)
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-backend-dev
  template:
    metadata:
      labels:
        app: hw-backend-dev
    spec:
      serviceAccountName: hw-backend-dev
      automountServiceAccountToken: false
      # 10s preStop + up to 25s app shutdown
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: hw-backend-dev
            - secretRef:
                name: hw-backend-dev
          # Not in the ConfigMap: the migration Job reads it too and must keep the master user.
          # IAM auth: 15-min token from the IRSA role (service account), no DB password in the pod.
          env:
            - name: PROD_DB_USERNAME
              value: app_user
            - name: PROD_DB_IAM_AUTH
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Liveness never checks the DB (a DB outage must not restart every pod)
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
