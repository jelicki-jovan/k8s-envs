apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-frontend-prod
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-frontend-prod
  template:
    metadata:
      labels:
        app: hw-frontend-prod
    spec:
      serviceAccountName: hw-frontend-prod
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Placement: 1 replica per AZ, >=1 on on-demand (rest can be spot), evenly spread over nodes
      topologySpreadConstraints:
        # Always 3 AZs, even before Karpenter has a node in each (missing zones count as 0 pods)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
        # Always both on-demand and spot: guarantees the on-demand replica even if only spot nodes exist
        - maxSkew: 1
          topologyKey: karpenter.sh/capacity-type
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
        # Even spread over nodes: 1 per node while there are enough nodes, 2+ only when the HPA scales
        # beyond the node count. Honor taints so the tainted system nodes don't count as empty nodes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
      containers:
        - name: frontend
          image: frontend
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps pid + temp files in /tmp
            - name: tmp
              mountPath: /tmp
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-snippets
          configMap:
            name: hw-frontend-prod-nginx
