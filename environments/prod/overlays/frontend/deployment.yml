apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-frontend-prod
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-frontend-prod
  template:
    metadata:
      labels:
        app: hw-frontend-prod
    spec:
      serviceAccountName: hw-frontend-prod
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Placement (rules are about this Deployment's pods; Karpenter adds nodes only when a pod can't fit):
      # even over 3 AZs, even over on-demand/spot, even over nodes. For 3 replicas: 1 per AZ, 3 nodes,
      # >=1 on-demand and >=1 spot.
      # matchLabelKeys pod-template-hash: spread is counted per revision, so during a rollout the old
      # ReplicaSet's pods (same app label) don't skew where the new ones land.
      topologySpreadConstraints:
        # Always 3 AZs, even before Karpenter has a node in each (missing zones count as 0 pods)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
          matchLabelKeys:
            - pod-template-hash
        # Even split on-demand/spot (3 -> 2+1 either way, 6 -> 3+3), never all on one type: minDomains 2
        # forces an on-demand node even if only spot nodes exist. ~Half the replicas survive a spot reclaim
        # wave, at the cost of more on-demand than "just 1" if replicas are raised.
        - maxSkew: 1
          topologyKey: karpenter.sh/capacity-type
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
          matchLabelKeys:
            - pod-template-hash
        # Even spread over nodes (counts differ by <=1): a 2nd pod on a node only once every app node has
        # one; alone it doesn't force new nodes (the zone rule does). Honor taints so the tainted system
        # nodes don't count as empty nodes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-frontend-prod
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: frontend
          image: frontend
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps pid + temp files in /tmp
            - name: tmp
              mountPath: /tmp
            - name: nginx-snippets
              mountPath: /etc/nginx/snippets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-snippets
          configMap:
            name: hw-frontend-prod-nginx
