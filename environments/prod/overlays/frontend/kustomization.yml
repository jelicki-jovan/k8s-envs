apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

labels:
  - pairs:
      app.kubernetes.io/name: hw-frontend-prod
      app.kubernetes.io/part-of: home-work
    includeSelectors: true

resources:
  - serviceaccount.yml
  - deployment.yml
  - service.yml
  - pdb.yml
  - ingress.yml

# nginx /api proxy, mounted into the image's /etc/nginx/snippets include hook
configMapGenerator:
  - name: hw-frontend-prod-nginx
    files:
      - api-proxy.conf

# CI updates newTag after pushing a new image
images:
  - name: frontend
    newName: 003636669641.dkr.ecr.us-east-1.amazonaws.com/hw-frontend-prod
    newTag: 49b4b3b
