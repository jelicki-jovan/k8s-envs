apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-backend-prod
spec:
  # No replicas here: the HPA owns the replica count (min 3); ArgoCD would otherwise fight it
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-backend-prod
  template:
    metadata:
      labels:
        app: hw-backend-prod
    spec:
      serviceAccountName: hw-backend-prod
      automountServiceAccountToken: false
      # 10s preStop + up to 25s app shutdown
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Placement (rules are about this Deployment's pods; Karpenter adds nodes only when a pod can't fit):
      # even over 3 AZs, even over on-demand/spot, even over nodes. For 3 replicas: 1 per AZ, 3 nodes,
      # >=1 on-demand and >=1 spot.
      # matchLabelKeys pod-template-hash: spread is counted per revision, so during a rollout the old
      # ReplicaSet's pods (same app label) don't skew where the new ones land.
      topologySpreadConstraints:
        # Always 3 AZs, even before Karpenter has a node in each (missing zones count as 0 pods)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
          matchLabelKeys:
            - pod-template-hash
        # Even split on-demand/spot (3 -> 2+1 either way, 6 -> 3+3), never all on one type: minDomains 2
        # forces an on-demand node even if only spot nodes exist. ~Half the replicas survive a spot reclaim
        # wave, at the cost of more on-demand than "just 1" when the HPA scales up.
        - maxSkew: 1
          topologyKey: karpenter.sh/capacity-type
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
          matchLabelKeys:
            - pod-template-hash
        # Even spread over nodes (counts differ by <=1): a 2nd pod on a node only once every app node has
        # one; alone it doesn't force new nodes (the zone rule does). Honor taints so the tainted system
        # nodes don't count as empty nodes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: backend
          image: backend
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: hw-backend-prod
            - secretRef:
                name: hw-backend-prod
          # Not in the ConfigMap: the migration Job reads it too and must keep the master user.
          # IAM auth: 15-min token from the IRSA role (service account), no DB password in the pod.
          env:
            - name: PROD_DB_USERNAME
              value: app_user
            - name: PROD_DB_IAM_AUTH
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Liveness never checks the DB (a DB outage must not restart every pod)
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
