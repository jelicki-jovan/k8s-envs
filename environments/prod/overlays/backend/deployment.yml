apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw-backend-prod
spec:
  # No replicas here: the HPA owns the replica count (min 3); ArgoCD would otherwise fight it
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hw-backend-prod
  template:
    metadata:
      labels:
        app: hw-backend-prod
    spec:
      serviceAccountName: hw-backend-prod
      automountServiceAccountToken: false
      # 10s preStop + up to 25s app shutdown
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Placement: 1 replica per AZ, >=1 on on-demand (rest can be spot), evenly spread over nodes
      topologySpreadConstraints:
        # Always 3 AZs, even before Karpenter has a node in each (missing zones count as 0 pods)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
        # Always both on-demand and spot: guarantees the on-demand replica even if only spot nodes exist
        - maxSkew: 1
          topologyKey: karpenter.sh/capacity-type
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
        # Even spread over nodes: 1 per node while there are enough nodes, 2+ only when the HPA scales
        # beyond the node count. Honor taints so the tainted system nodes don't count as empty nodes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: hw-backend-prod
      containers:
        - name: backend
          image: backend
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: hw-backend-prod
            - secretRef:
                name: hw-backend-prod
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Liveness never checks the DB (a DB outage must not restart every pod)
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Give the ALB/endpoints time to stop sending new requests before SIGTERM
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
