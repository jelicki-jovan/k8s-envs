apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw-backend-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Terraform: hw-eks-backend-prod, rds-db:connect as app_user (IAM database authentication)
    eks.amazonaws.com/role-arn: arn:aws:iam::003636669641:role/hw-eks-backend-prod
# The app never talks to the Kubernetes API. IRSA still works: the EKS webhook mounts its own
# projected token (audience sts.amazonaws.com), independent of this setting.
automountServiceAccountToken: false
